// 用 buildscript classpath 引 AGP；仓库与同机其他项目保持一致（缓存可复用）
buildscript {
    repositories {
        google()
        mavenCentral()
        maven { url 'https://mirrors.cloud.tencent.com/nexus/repository/maven-public/' }
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.5.2'
    }
}
